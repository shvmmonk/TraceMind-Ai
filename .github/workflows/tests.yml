name: TraceMind Tests
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_investigator.py tests/test_llm.py
      - name: Smoke test real services
        run: |
          python run_demo.py > /tmp/tracemind.log 2>&1 &
          DEMO_PID=$!
          trap 'kill $DEMO_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 1
          done
          python tests/smoke.py
